<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd59e"/>
      <stop offset="1" stop-color="#bfe6ff"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff8c1a"/>
    </linearGradient>
    <g id="spokes">
      <circle r="44" fill="none" stroke="#2b2b2b" stroke-width="7"/>
      <circle r="40" fill="none" stroke="#666" stroke-width="1.5"/>
      <g stroke="#888" stroke-width="1.6">
        <line x1="-40" y1="0" x2="40" y2="0"/>
        <line x1="0" y1="-40" x2="0" y2="40"/>
        <line x1="-28" y1="-28" x2="28" y2="28"/>
        <line x1="-28" y1="28" x2="28" y2="-28"/>
      </g>
      <circle r="5" fill="#444"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="800" height="420" fill="url(#sky)"/>
  <circle cx="650" cy="90" r="48" fill="#fff3b0" opacity=".9"/>

  <!-- clouds drifting -->
  <g fill="#fff" opacity=".85">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="30s" repeatCount="indefinite"/>
      <ellipse cx="300" cy="70" rx="45" ry="18"/><ellipse cx="330" cy="60" rx="30" ry="16"/>
      <ellipse cx="1100" cy="110" rx="55" ry="20"/><ellipse cx="1135" cy="98" rx="32" ry="16"/>
    </g>
  </g>

  <!-- far hills, slow parallax -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="12s" repeatCount="indefinite"/>
    <path d="M0 290 Q100 230 200 290 T400 290 T600 290 T800 290 T1000 290 T1200 290 L1200 420 L0 420 Z" fill="#9fd38a"/>
  </g>

  <!-- road -->
  <rect y="330" width="800" height="90" fill="#6b6b6b"/>
  <rect y="326" width="800" height="6" fill="#4f4f4f"/>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="0.6s" repeatCount="indefinite"/>
    <g fill="#f5f5f5">
      <rect x="0" y="372" width="60" height="6" rx="3"/><rect x="120" y="372" width="60" height="6" rx="3"/>
      <rect x="240" y="372" width="60" height="6" rx="3"/><rect x="360" y="372" width="60" height="6" rx="3"/>
      <rect x="480" y="372" width="60" height="6" rx="3"/><rect x="600" y="372" width="60" height="6" rx="3"/>
      <rect x="720" y="372" width="60" height="6" rx="3"/><rect x="840" y="372" width="60" height="6" rx="3"/>
    </g>
  </g>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".7">
    <line x1="200" y1="230" x2="240" y2="230">
      <animate attributeName="x1" values="230;150" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="260;200" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="210" y1="260" x2="250" y2="260">
      <animate attributeName="x1" values="240;160" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="275;210" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- whole rider: gentle bob -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="0.5s" repeatCount="indefinite"/>

    <!-- wheels (centers at 300,282 and 470,282) -->
    <g transform="translate(300 282)">
      <g><use href="#spokes"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="translate(470 282)">
      <g><use href="#spokes"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- frame: crank at 385,282 -->
    <g stroke="#2a7de1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M300 282 L385 282 L360 205 Z"/>
      <path d="M385 282 L450 210 L360 205"/>
      <path d="M450 210 L470 282"/>
      <path d="M450 210 L445 190 L468 182"/>
    </g>
    <!-- seat -->
    <path d="M342 200 Q360 192 378 200 L372 206 L348 206 Z" fill="#333"/>
    <line x1="360" y1="205" x2="360" y2="200" stroke="#333" stroke-width="5"/>
    <!-- handlebar grip -->
    <circle cx="468" cy="182" r="5" fill="#333"/>

    <!-- far leg + pedal (180° offset) -->
    <g>
      <g transform="translate(385 282)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="0.6s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="0" y2="22" stroke="#555" stroke-width="5" stroke-linecap="round"/>
          <rect x="-9" y="20" width="18" height="5" rx="2" fill="#555"/>
        </g>
      </g>
    </g>

    <!-- chainring -->
    <circle cx="385" cy="282" r="13" fill="none" stroke="#444" stroke-width="4"/>
    <path d="M385 269 L300 276 M385 295 L300 288" stroke="#444" stroke-width="2"/>

    <!-- pelican body -->
    <!-- tail -->
    <path d="M300 160 L272 150 L282 170 Z" fill="#f2f2f2" stroke="#d6d6d6" stroke-width="1.5"/>
    <!-- body -->
    <ellipse cx="350" cy="165" rx="58" ry="42" fill="#ffffff" stroke="#dcdcdc" stroke-width="2"/>
    <!-- wing, flapping a little -->
    <g transform="translate(335 160)">
      <path d="M0 0 C30 -10 55 5 60 25 C35 30 10 22 0 0 Z" fill="#e9e9e9" stroke="#cfcfcf" stroke-width="1.5">
        <animateTransform attributeName="transform" type="rotate" values="-6 0 0;6 0 0;-6 0 0" dur="0.6s" repeatCount="indefinite"/>
      </path>
      <path d="M38 18 L60 25 L46 30 Z" fill="#3a3a3a">
        <animateTransform attributeName="transform" type="rotate" values="-6 0 0;6 0 0;-6 0 0" dur="0.6s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- arm/wing tip to handlebar -->
    <path d="M385 165 Q430 170 466 182" fill="none" stroke="#e9e9e9" stroke-width="9" stroke-linecap="round"/>

    <!-- neck -->
    <path d="M385 140 C405 110 395 85 405 70" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    <path d="M385 140 C405 110 395 85 405 70" fill="none" stroke="#dcdcdc" stroke-width="22" stroke-linecap="round" opacity=".35"/>

    <!-- head group, slight nod -->
    <g transform="translate(410 62)">
      <animateTransform attributeName="transform" type="rotate" values="-3 0 10;3 0 10;-3 0 10" dur="0.6s" repeatCount="indefinite" additive="sum"/>
      <ellipse cx="0" cy="0" rx="20" ry="17" fill="#ffffff" stroke="#dcdcdc" stroke-width="2"/>
      <!-- crest -->
      <path d="M-10 -14 Q-4 -26 4 -16" fill="none" stroke="#f3e2a9" stroke-width="4" stroke-linecap="round"/>
      <!-- eye -->
      <circle cx="6" cy="-4" r="4" fill="#222"/>
      <circle cx="7.5" cy="-5.5" r="1.3" fill="#fff"/>
      <!-- upper beak -->
      <path d="M14 -2 L96 8 Q100 10 96 12 L16 8 Z" fill="url(#beak)"/>
      <!-- throat pouch -->
      <path d="M16 8 L96 12 Q70 42 30 34 Q14 26 16 8 Z" fill="#ffc46b" stroke="#f0a640" stroke-width="1.5">
        <animate attributeName="d" values="M16 8 L96 12 Q70 42 30 34 Q14 26 16 8 Z;M16 8 L96 12 Q70 48 30 38 Q14 28 16 8 Z;M16 8 L96 12 Q70 42 30 34 Q14 26 16 8 Z" dur="0.6s" repeatCount="indefinite"/>
      </path>
      <!-- helmet -->
      <path d="M-20 -6 Q-18 -30 6 -28 Q22 -24 20 -10 Z" fill="#ff4d6d"/>
      <path d="M-14 -16 L14 -20" stroke="#fff" stroke-width="2" opacity=".7"/>
    </g>

    <!-- near leg, animated to pedal -->
    <!-- hip at 360,190 ; pedal moves on circle r=22 around 385,282 -->
    <g stroke="#ff9f1c" stroke-width="7" stroke-linecap="round" fill="none">
      <polyline>
        <animate attributeName="points" dur="0.6s" repeatCount="indefinite"
          values="360,190 395,240 385,304;
                  360,190 410,235 407,282;
                  360,190 395,225 385,260;
                  360,190 375,240 363,282;
                  360,190 395,240 385,304"/>
      </polyline>
    </g>
    <!-- foot + near pedal -->
    <g transform="translate(385 282)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="0" y2="22" stroke="#333" stroke-width="5" stroke-linecap="round"/>
        <g transform="translate(0 22)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="0.6s" repeatCount="indefinite"/>
            <rect x="-10" y="-2" width="20" height="5" rx="2" fill="#333"/>
            <path d="M-6 -3 L12 -3 L8 -9 Z" fill="#ff9f1c"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <text x="400" y="408" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#fff" opacity=".85">鹈鹕骑自行车 · SVG 动画</text>
</svg>
